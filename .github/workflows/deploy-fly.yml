name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never cancel a deploy mid-flight

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Wait for health check
        run: |
          echo "Waiting for app to become healthy..."
          APP_URL=$(flyctl info --json | jq -r '.Hostname')
          MAX_RETRIES=12
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$APP_URL/health" || echo "000")
            if [[ "$STATUS" == "200" ]]; then
              echo "✓ App healthy (attempt $i)"
              exit 0
            fi
            echo "  Attempt $i/$MAX_RETRIES: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "✗ App failed to become healthy"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: deployments
          slack-message: "❌ Deploy to Fly.io FAILED for ${{ github.repository }} @ ${{ github.sha }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true
